<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Portfolio</title>
  <link rel="stylesheet" href="leostyle.css"/>
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
    </div>

    <div class="brand">Leo Da Silva</div>

    <div class="nav-right">
      <a href="#socials">Socials</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section id="home" class="hero fade-in">
    <div class="hero-side">
      <h2 class="hero-name">Leo Da Silva</h2>
      <h3 class="hero-subname">Model & Actor</h3>
      <p>
         A dynamic actor and model known for blending professionalism, confidence, and creative versatility in every project taken on.
      </p>
    </div>

    <div class="hero-image">
      <img src="leodasilva pic 2.jpg">
    </div>
  </section>

  <section id="gallery" class="gallery fade-in">
    <h2>Portfolio Scroll</h2>
    <div class="photo-grid">
      <img src="leodasilva pic 3.jpg" alt="Photo 1">
      <img src="leodasilva pic 4 .jpg" alt="Photo 2">
      <img src="leodasilva pic 5.jpg" alt="Photo 3">
    </div>
  </section>

  <section id="socials" class="social-section fade-in">
    <h2>Connect</h2>
    <div class="social-wrap" id="contact">
      <a href="#" class="social-card">Instagram</a>
      <a href="#" class="social-card">TikTok</a>
      <a href="#" class="social-card">Email</a>
      <a href="#" class="social-card">Agency / Booking Contact</a>
    </div>
  </section>

  <footer>
    © 2026 leo Da Silva
  </footer>

<script src="bigscript.js" charset="utf-8"></script>

</body>
</html>
